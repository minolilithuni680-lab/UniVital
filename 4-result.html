<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UniVital - Results</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); font-family: 'Poppins', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .cute-card { background: rgba(255, 255, 255, 0.95); border-radius: 25px; padding: 40px; width: 100%; max-width: 550px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .btn-cute { background-color: #6c5ce7; color: white; font-family: 'Fredoka', cursive; border-radius: 50px; padding: 10px 30px; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>
    <div class="cute-card">
        <h2 class="text-center mb-3" style="font-family:'Fredoka', cursive; color:#6c5ce7;">🧪 Biological Feedback</h2>
        <div id="feedbackBox" class="mb-4"></div>
        
        <!-- CONNECTS PAGE 4 TO PAGE 5 -->
        <a href="5-chart.html" class="btn-cute w-100 text-center">View Weekly Analytics 📊</a>
    </div>

    <script>
        const water = parseFloat(localStorage.getItem('waterVal'));
        const caffeine = localStorage.getItem('caffeineVal');
        const meal = localStorage.getItem('mealVal');

        let output = '';

        if(water < 2.0) {
            output += `<div class="p-3 mb-2 bg-warning-subtle text-dark rounded-3">💧 <strong>Cellular Dehydration Warning:</strong> Under 2L triggers Vasopressin, leading to brain fog.</div>`;
        } else {
            output += `<div class="p-3 mb-2 bg-success-subtle text-dark rounded-3">💧 <strong>Optimal Hydration:</strong> Excellent neuronal fluid balance!</div>`;
        }

        if(caffeine === 'yes') {
            output += `<div class="p-3 mb-2 bg-danger-subtle text-dark rounded-3">☕ <strong>Sleep Disruption Risk:</strong> Late caffeine acts as an adenosine antagonist, blocking deep REM sleep.</div>`;
        }

        if(meal === 'unhealthy') {
            output += `<div class="p-3 mb-2 bg-danger-subtle text-dark rounded-3">🍎 <strong>Glycemic Crash Imminent:</strong> High-GI food causes an insulin spike followed by severe fatigue.</div>`;
        }

        document.getElementById('feedbackBox').innerHTML = output;
    </script>
</body>
</html>
