<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniVital - Phase 3: Sleep Architecture</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #eef7f2; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px 15px; }
        .card-custom { max-width: 750px; margin: auto; background: #ffffff; border-radius: 16px; padding: 35px; box-shadow: 0 8px 25px rgba(0,0,0,0.06); }
        .info-box { background-color: #d1e7dd; border-left: 4px solid #198754; padding: 12px 16px; border-radius: 6px; font-size: 0.88rem; margin-bottom: 25px; }
        .step-badge { font-size: 0.75rem; letter-spacing: 1px; font-weight: 700; text-transform: uppercase; }
        .btn-submit { background-color: #198754; color: white; font-weight: 700; padding: 12px 24px; border-radius: 8px; border: none; }
        .btn-submit:hover { background-color: #146c43; color: white; }
    </style>
</head>
<body>

<div class="card-custom">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="badge bg-primary step-badge">Phase 3 of 3</span>
        <span class="text-muted small"><i class="fa-solid fa-moon text-primary me-1"></i> Circadian Rhythm</span>
    </div>

    <h3 class="fw-bold text-dark mb-1">Sleep & Rest Quality</h3>
    <p class="text-muted small mb-4">Assess sleep duration, quality score, and wakefulness consistency.</p>

    <div class="info-box text-dark">
        <i class="fa-solid fa-bed text-success me-1"></i>
        <strong>Biological Insight:</strong> Consistent sleep-wake cycles align your suprachiasmatic nucleus (SCN) to regulate hormonal secretion (cortisol and melatonin).
    </div>

    <form id="phase3Form" onsubmit="savePhase3(event)">
        <!-- Q1: Sleep Duration -->
        <div class="mb-4">
            <label for="sleepHours" class="form-label fw-bold text-dark">1. How many total hours of sleep did you get last night?</label>
            <input type="number" step="0.5" min="0" max="24" class="form-control" id="sleepHours" placeholder="e.g. 7.5" required>
        </div>

        <!-- Q2: Sleep Quality -->
        <div class="mb-4">
            <label for="sleepQuality" class="form-label fw-bold text-dark">2. How would you rate the subjective quality of your sleep?</label>
            <select class="form-select" id="sleepQuality" required>
                <option value="" disabled selected>Select rating...</option>
                <option value="Restful & Deep">Restful & Deep (Awoke energized)</option>
                <option value="Moderate / Average">Moderate (Felt okay, slightly groggy)</option>
                <option value="Fragmented / Restless">Fragmented / Restless (Woke up multiple times)</option>
                <option value="Severely Deprived">Severely Deprived (Exhausted upon waking)</option>
            </select>
        </div>

        <!-- Q3: Evening Screen Time -->
        <div class="mb-4">
            <label for="screenTime" class="form-label fw-bold text-dark">3. Did you use electronic screens within 1 hour before sleeping?</label>
            <select class="form-select" id="screenTime" required>
                <option value="" disabled selected>Select option...</option>
                <option value="Yes - Heavy exposure">Yes (Heavy screen exposure right before bed)</option>
                <option value="Yes - Light exposure / Blue light filter">Yes (Light exposure or blue light filter used)</option>
                <option value="No screens before bed">No (Avoided screens 1 hour prior)</option>
            </select>
        </div>

        <div class="d-flex justify-content-between mt-4">
            <a href="3-questions-2.html" class="btn btn-outline-secondary fw-bold">Back</a>
            <button type="submit" class="btn btn-submit"><i class="fa-solid fa-check-circle me-1"></i> Complete & Save Vitals</button>
        </div>
    </form>
</div>

<script>
    function savePhase3(e) {
        e.preventDefault();

        // 1. Gather Phase 3 Data
        const phase3Data = {
            sleepHours: document.getElementById('sleepHours').value,
            sleepQuality: document.getElementById('sleepQuality').value,
            screenTime: document.getElementById('screenTime').value
        };

        // 2. Fetch data from previous phases
        const phase1Data = JSON.parse(localStorage.getItem('uniVital_Phase1')) || {};
        const phase2Data = JSON.parse(localStorage.getItem('uniVital_Phase2')) || {};

        // 3. Construct unified master entry
        const completeVitals = {
            timestamp: new Date().toLocaleString(),
            user: localStorage.getItem('uniVitalUserName') || 'Anonymous',
            email: localStorage.getItem('uniVitalUserEmail') || 'N/A',
            hydration: phase1Data,
            caffeine: phase2Data,
            sleep: phase3Data
        };

        // 4. Save to master storage array
        let fullHistory = JSON.parse(localStorage.getItem('uniVitalMasterLogs')) || [];
        fullHistory.push(completeVitals);

        localStorage.setItem('uniVitalMasterLogs', JSON.stringify(fullHistory));
        localStorage.setItem('latestVitalsEntry', JSON.stringify(completeVitals));

        // 5. Redirect to results dashboard
        alert("Daily Health Vitals successfully logged!");
        window.location.href = "4-dashboard.html"; // Or your main results page
    }
</script>
</body>
</html>
