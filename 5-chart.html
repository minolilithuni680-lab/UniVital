<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UniVital - Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); font-family: 'Poppins', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .cute-card { background: rgba(255, 255, 255, 0.95); border-radius: 25px; padding: 40px; width: 100%; max-width: 550px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .btn-cute { background-color: #6c5ce7; color: white; font-family: 'Fredoka', cursive; border-radius: 50px; padding: 10px 30px; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>
    <div class="cute-card text-center">
        <h2 style="font-family:'Fredoka', cursive; color:#6c5ce7;">📊 Profile Analytics</h2>
        <p>Weekly trend for <strong id="studentName">Student</strong></p>
        
        <div class="p-2 bg-light rounded-4 mb-4">
            <canvas id="myChart"></canvas>
        </div>

        <a href="3-questions.html" class="btn-cute">+ Add Today's Log</a>
    </div>

    <script>
        document.getElementById('studentName').innerText = localStorage.getItem('studentName') || "Student";

        const ctx = document.getElementById('myChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                datasets: [{
                    label: 'Water Intake (L)',
                    data: [1.5, 2.0, 1.0, 2.5, 3.0, 1.5, parseFloat(localStorage.getItem('waterVal')) || 2.0],
                    borderColor: '#6c5ce7',
                    tension: 0.3
                }]
            }
        });
    </script>
</body>
</html>
