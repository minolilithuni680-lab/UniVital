<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniVital - Real-Time Weekly Analytics</title>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary-emerald: #10b981;
            --dark-navy: #0f172a;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%);
            min-height: 100vh;
            padding: 30px 15px;
            color: #334155;
        }

        .dashboard-container { max-width: 1100px; margin: 0 auto; }

        .chart-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
            height: 100%;
        }

        .report-banner {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border-radius: 20px;
            padding: 30px;
            color: #ffffff;
        }

        .btn-download {
            background-color: var(--primary-emerald);
            color: white; font-weight: 600;
            border-radius: 25px; padding: 10px 24px; border: none;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <span class="badge bg-success mb-1">LIVE DATA ANALYTICS</span>
                <h2 class="fw-bold m-0" style="font-family: 'Fredoka', cursive; color: #0f172a;">Your Real Weekly Vitals</h2>
            </div>
            <div>
                <button class="btn btn-outline-danger btn-sm rounded-pill me-2" onclick="resetData()"><i class="fa-solid fa-trash me-1"></i> Reset Week</button>
                <a href="3-questions.html" class="btn btn-success btn-sm rounded-pill me-2"><i class="fa-solid fa-plus me-1"></i> Log Vitals</a>
                <a href="1-welcome.html" class="btn btn-outline-secondary btn-sm rounded-pill"><i class="fa-solid fa-house me-1"></i> Home</a>
            </div>
        </div>

        <!-- WEEKLY DYNAMIC REPORT BANNER -->
        <div class="report-banner mb-5">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <span class="badge bg-emerald text-white px-3 py-1 rounded-pill mb-2" style="background-color: #10b981;">REAL-TIME SUMMARY</span>
                    <h3 class="fw-bold" style="font-family: 'Fredoka', cursive;" id="reportGrade">Weekly Grade: Computing...</h3>
                    <p class="text-light opacity-75 small mb-0" id="reportDetails">
                        Log your daily vitals to build your personal physiological report.
                    </p>
                </div>
                <div class="col-md-4 text-md-end mt-3 mt-md-0">
                    <button class="btn-download" onclick="alert('Downloading your custom weekly report...')">
                        <i class="fa-solid fa-file-arrow-down me-2"></i>Download Report
                    </button>
                </div>
            </div>
        </div>

        <!-- CHARTS GRID -->
        <div class="row g-4">
            
            <!-- WATER CHART -->
            <div class="col-md-6">
                <div class="chart-card">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-droplet text-info me-2"></i>Water Intake (Liters)</h5>
                    <canvas id="hydrationChart" height="200"></canvas>
                </div>
            </div>

            <!-- CAFFEINE CHART -->
            <div class="col-md-6">
                <div class="chart-card">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-mug-hot text-warning me-2"></i>Caffeine Intake (mg)</h5>
                    <canvas id="caffeineChart" height="200"></canvas>
                </div>
            </div>

            <!-- SLEEP CHART -->
            <div class="col-md-6">
                <div class="chart-card">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-moon text-primary me-2"></i>Sleep Duration (Hours)</h5>
                    <canvas id="sleepChart" height="200"></canvas>
                </div>
            </div>

            <!-- WEEKLY COMPLETION PROGRESS -->
            <div class="col-md-6">
                <div class="chart-card text-center d-flex flex-column justify-content-center align-items-center">
                    <h5 class="fw-bold mb-2"><i class="fa-solid fa-calendar-check text-success me-2"></i>Week Days Logged</h5>
                    <h1 class="display-3 fw-bold text-success m-0" id="daysLoggedCount">0/7</h1>
                    <p class="text-muted small mt-2">Days completed with real entries</p>
                </div>
            </div>

        </div>

    </div>

    <script>
        const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

        // Retrieve saved user data or default to zeros
        const defaultData = {
            Mon: { water: 0, caffeine: 0, sleep: 0 },
            Tue: { water: 0, caffeine: 0, sleep: 0 },
            Wed: { water: 0, caffeine: 0, sleep: 0 },
            Thu: { water: 0, caffeine: 0, sleep: 0 },
            Fri: { water: 0, caffeine: 0, sleep: 0 },
            Sat: { water: 0, caffeine: 0, sleep: 0 },
            Sun: { water: 0, caffeine: 0, sleep: 0 }
        };

        const storedData = JSON.parse(localStorage.getItem('uniVitalData')) || defaultData;

        // Extract arrays for Chart.js
        const waterArray = days.map(day => storedData[day].water);
        const caffeineArray = days.map(day => storedData[day].caffeine);
        const sleepArray = days.map(day => storedData[day].sleep);

        // Count logged days
        let loggedDays = 0;
        days.forEach(day => {
            if (storedData[day].water > 0 || storedData[day].caffeine > 0 || storedData[day].sleep > 0) {
                loggedDays++;
            }
        });
        document.getElementById('daysLoggedCount').innerText = `${loggedDays}/7`;

        // Calculate dynamic weekly grade
        const avgWater = (waterArray.reduce((a,b) => a+b, 0) / (loggedDays || 1)).toFixed(1);
        const avgSleep = (sleepArray.reduce((a,b) => a+b, 0) / (loggedDays || 1)).toFixed(1);

        if (loggedDays === 0) {
            document.getElementById('reportGrade').innerText = "Weekly Grade: Pending Log Entries";
            document.getElementById('reportDetails').innerText = "You have not entered any data for this week yet. Click 'Log Vitals' to start!";
        } else {
            document.getElementById('reportGrade').innerText = `Weekly Grade: ${avgWater >= 2.0 && avgSleep >= 7 ? 'Grade A (Optimal)' : 'Grade B (Good Progress)'}`;
            document.getElementById('reportDetails').innerText = `Logged ${loggedDays} day(s). Average daily water: ${avgWater}L | Average sleep: ${avgSleep} hrs.`;
        }

        // Render Charts with REAL data
        new Chart(document.getElementById('hydrationChart'), {
            type: 'bar',
            data: { labels: days, datasets: [{ label: 'Liters', data: waterArray, backgroundColor: '#0ea5e9', borderRadius: 8 }] }
        });

        new Chart(document.getElementById('caffeineChart'), {
            type: 'line',
            data: { labels: days, datasets: [{ label: 'mg', data: caffeineArray, borderColor: '#f59e0b', backgroundColor: 'rgba(245, 158, 11, 0.1)', fill: true, tension: 0.3 }] }
        });

        new Chart(document.getElementById('sleepChart'), {
            type: 'bar',
            data: { labels: days, datasets: [{ label: 'Hours', data: sleepArray, backgroundColor: '#6366f1', borderRadius: 8 }] }
        });

        function resetData() {
            if (confirm("Are you sure you want to reset all logged data for this week?")) {
                localStorage.removeItem('uniVitalData');
                location.reload();
            }
        }
    </script>
</body>
</html>
