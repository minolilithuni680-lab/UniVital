<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniVital - Sign In</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #d1e7dd;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            max-width: 950px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
        }

        .bio-panel {
            background: #0d1b2a;
            color: #ffffff;
            padding: 35px 30px;
            flex: 1.2;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .login-panel {
            padding: 40px 35px;
            flex: 1;
            min-width: 300px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-title {
            color: #198754;
            font-weight: 800;
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 1px;
        }

        .btn-signin {
            background-color: #198754;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-signin:hover {
            background-color: #146c43;
            color: white;
        }

        .diagnostic-box {
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            padding: 15px;
            border-radius: 8px;
            margin-top: 25px;
        }

        .btn-lis {
            background-color: #ffc107;
            color: #000000;
            text-decoration: none;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 6px;
            display: inline-block;
            margin-top: 5px;
        }

        .btn-lis:hover {
            background-color: #e0a800;
            color: #000000;
        }

        /* Pill Navigation Styling */
        .sim-pill {
            background: rgba(255, 255, 255, 0.1);
            color: #a0aab2;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .sim-pill.active {
            background: #198754;
            color: #ffffff;
            border-color: #198754;
        }

        .sim-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <!-- LEFT PANEL: BIO-SIMULATION HUB -->
    <div class="bio-panel">
        <div>
            <!-- Header -->
            <div class="d-flex align-items-center justify-content-between mb-3">
                <div class="d-flex align-items-center">
                    <i class="fa-solid fa-microscope text-success me-2 fs-5"></i>
                    <h6 class="m-0 fw-bold text-success text-uppercase" style="letter-spacing: 1px;">Bio-Simulation Hub</h6>
                </div>
                <span class="badge bg-success" style="font-size: 0.65rem;">LIVE</span>
            </div>

            <!-- Theory Selector Pills -->
            <div class="d-flex gap-2 mb-4">
                <button type="button" class="sim-pill active" onclick="switchSim('caffeine')">
                    <i class="fa-solid fa-bolt me-1"></i> Caffeine Effect
                </button>
                <button type="button" class="sim-pill" onclick="switchSim('sleep')">
                    <i class="fa-solid fa-moon me-1"></i> Sleep Cycle
                </button>
                <button type="button" class="sim-pill" onclick="switchSim('hydration')">
                    <i class="fa-solid fa-droplet me-1"></i> Hydration
                </button>
            </div>

            <!-- Display Card for Selected Theory -->
            <div class="sim-card text-center">
                <img id="sim-img" src="https://images.unsplash.com/photo-1559757175-5700dde675bc?w=500&auto=format&fit=crop&q=60" alt="Simulation Image" class="img-fluid rounded mb-3" style="max-height: 140px; object-fit: cover; width: 100%;">
                
                <h6 id="sim-title" class="text-white text-start fw-bold mb-2">
                    <i class="fa-solid fa-bolt text-warning me-1"></i> Adenosine Receptor Blockade
                </h6>
                <p id="sim-desc" class="text-secondary small text-start m-0" style="font-size: 0.8rem; line-height: 1.4;">
                    Caffeine binds to A₁/A₂ₐ receptors in brain neural networks, preventing fatigue signals and optimizing focus.
                </p>
            </div>
        </div>

        <!-- Footer Note -->
        <div class="text-start mt-4">
            <small class="text-muted" style="font-size: 0.7rem;">Powered by <strong>UniVital Biological Engine v2.0</strong></small>
        </div>
    </div>

    <!-- RIGHT PANEL: SIGN IN FORM -->
    <div class="login-panel">
        <h2 class="form-title">SIGN IN</h2>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <!-- Full Name Input -->
            <div class="mb-3 text-start">
                <label for="userName" class="form-label fw-bold text-dark small">Full Name *</label>
                <input type="text" class="form-control" id="userName" placeholder="Enter your full name" required>
            </div>

            <!-- Email Address Input -->
            <div class="mb-3 text-start">
                <label for="userEmail" class="form-label fw-bold text-dark small">Email Address *</label>
                <input type="email" class="form-control" id="userEmail" placeholder="name@example.com" required>
            </div>

            <!-- Submit Button -->
            <div class="d-grid gap-2 mt-4">
                <button type="submit" id="btnSubmit" class="btn btn-signin">Sign In</button>
            </div>
        </form>

        <!-- Secondary Action -->
        <div class="diagnostic-box text-center">
            <p class="text-secondary small mb-1">Ready to enter your daily vital status?</p>
            <a href="3-start.html" class="btn-lis">Go to Daily Health Vitals <i class="fa-solid fa-arrow-right ms-1"></i></a>
        </div>
    </div>
</div>

<!-- JavaScript Section -->
<script>
    // 1. Switch between the three theory modes
    function switchSim(mode) {
        const pills = document.querySelectorAll('.sim-pill');
        pills.forEach(p => p.classList.remove('active'));

        const img = document.getElementById('sim-img');
        const title = document.getElementById('sim-title');
        const desc = document.getElementById('sim-desc');

        if (mode === 'caffeine') {
            pills[0].classList.add('active');
            img.src = "https://images.unsplash.com/photo-1559757175-5700dde675bc?w=500&auto=format&fit=crop&q=60";
            title.innerHTML = '<i class="fa-solid fa-bolt text-warning me-1"></i> Adenosine Receptor Blockade';
            desc.innerText = "Caffeine binds to A₁/A₂ₐ receptors in brain neural networks, preventing fatigue signals and optimizing focus.";
        } else if (mode === 'sleep') {
            pills[1].classList.add('active');
            img.src = "https://images.unsplash.com/photo-1541781774459-bb2af2f05b55?w=500&auto=format&fit=crop&q=60";
            title.innerHTML = '<i class="fa-solid fa-moon text-info me-1"></i> Circadian Sleep Architecture';
            desc.innerText = "Deep REM sleep regulates cortisol levels, clears metabolic waste from the brain, and facilitates memory consolidation.";
        } else if (mode === 'hydration') {
            pills[2].classList.add('active');
            img.src = "https://images.unsplash.com/photo-1523362628745-0c100150b504?w=500&auto=format&fit=crop&q=60";
            title.innerHTML = '<i class="fa-solid fa-droplet text-primary me-1"></i> Cellular Electrolyte Balance';
            desc.innerText = "Optimal hydration maintains plasma volume, enhances nutrient transport to brain cells, and regulates body temperature.";
        }
    }

    // 2. Handle Login & Save BOTH current user and complete history log
    function handleLogin(event) {
        event.preventDefault(); 

        const nameInput = document.getElementById('userName');
        const emailInput = document.getElementById('userEmail');

        if (nameInput && emailInput) {
            const name = nameInput.value;
            const email = emailInput.value;

            // Save active user (for page validation on 3-questions.html)
            localStorage.setItem('uniVitalUserName', name);
            localStorage.setItem('uniVitalUserEmail', email);

            // Fetch existing history list or start a new array
            let userHistory = JSON.parse(localStorage.getItem('uniVitalUserHistory')) || [];

            // Add current user details + timestamp
            userHistory.push({
                name: name,
                email: email,
                timestamp: new Date().toLocaleString()
            });

            // Save updated history back to Local Storage
            localStorage.setItem('uniVitalUserHistory', JSON.stringify(userHistory));

            // Redirect smoothly to next page
            window.location.href = "3-start.html";
        }
    }
</script>

</body>
</html>
