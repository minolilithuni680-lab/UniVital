<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UniVital - Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); font-family: 'Poppins', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .cute-card { background: rgba(255, 255, 255, 0.95); border-radius: 25px; padding: 40px; width: 100%; max-width: 500px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .btn-cute { background-color: #6c5ce7; color: white; font-family: 'Fredoka', cursive; border-radius: 50px; padding: 10px; border: none; width: 100%; text-decoration: none; display: block; text-align: center; }
    </style>
</head>
<body>
    <div class="cute-card">
        <h2 class="text-center mb-4" style="font-family:'Fredoka', cursive; color:#6c5ce7;">👤 Student Profile</h2>
        <form>
            <div class="mb-3">
                <label class="fw-bold">Full Name</label>
                <input type="text" id="name" class="form-control rounded-3" placeholder="Kasuni Perera">
            </div>
            <div class="mb-4">
                <label class="fw-bold">Student Registration No.</label>
                <input type="text" id="regNo" class="form-control rounded-3" placeholder="SEU/IS/20/05">
            </div>
            
            <!-- THIS BUTTON SAVES DATA & CONNECTS PAGE 2 TO PAGE 3 -->
            <button type="button" class="btn-cute" onclick="saveAndGoNext()">Continue to Questions ➔</button>
        </form>
    </div>

    <script>
        function saveAndGoNext() {
            const name = document.getElementById('name').value;
            // Save the student's name into local browser storage so other pages can use it!
            localStorage.setItem('studentName', name);
            // Redirect to Page 3
            window.location.href = "3-questions.html";
        }
    </script>
</body>
</html>
