<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UniVital - Questions</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); font-family: 'Poppins', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .cute-card { background: rgba(255, 255, 255, 0.95); border-radius: 25px; padding: 40px; width: 100%; max-width: 500px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .btn-cute { background-color: #6c5ce7; color: white; font-family: 'Fredoka', cursive; border-radius: 50px; padding: 10px; border: none; width: 100%; }
    </style>
</head>
<body>
    <div class="cute-card">
        <h2 style="font-family:'Fredoka', cursive; color:#6c5ce7;">📝 Daily Bio-Log</h2>
        <p>Welcome, <strong id="studentDisplayName" class="text-primary">Student</strong>!</p>
        
        <form>
            <div class="mb-3">
                <label class="fw-bold">💧 Water Intake (Liters)</label>
                <input type="number" id="water" class="form-control rounded-3" value="1.5" step="0.5">
            </div>
            <div class="mb-3">
                <label class="fw-bold">☕ Late Night Caffeine?</label>
                <select id="caffeine" class="form-select rounded-3">
                    <option value="no">No / Before 5 PM</option>
                    <option value="yes">Yes, after 5 PM</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="fw-bold">🍎 Meal Quality</label>
                <select id="meal" class="form-select rounded-3">
                    <option value="healthy">Healthy Foods (Low GI)</option>
                    <option value="unhealthy">Fast Food / Sugary Snacks (High GI)</option>
                </select>
            </div>

            <!-- SAVES HABITS & CONNECTS PAGE 3 TO PAGE 4 -->
            <button type="button" class="btn-cute" onclick="processHabits()">Analyze My Day 🔬</button>
        </form>
    </div>

    <script>
        // Load the student's name saved on Page 2
        document.getElementById('studentDisplayName').innerText = localStorage.getItem('studentName') || "Student";

        function processHabits() {
            localStorage.setItem('waterVal', document.getElementById('water').value);
            localStorage.setItem('caffeineVal', document.getElementById('caffeine').value);
            localStorage.setItem('mealVal', document.getElementById('meal').value);
            
            // Redirect to Page 4
            window.location.href = "4-result.html";
        }
    </script>
</body>
</html>
